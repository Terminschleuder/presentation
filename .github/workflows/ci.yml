name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*", "alpha-*", "*alpha"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute version + build deck, no tag/release"
        type: boolean
        default: false

permissions:
  contents: read

# PRs and develop pushes may cancel their in-flight predecessors, but a push to
# main never cancels a running release — it queues behind it (see the job-level
# release-queue group below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: Build deck (Marp → PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The official Marp CLI image bundles Node + Chromium, so mermaid
      # diagrams and raw HTML render to PDF with no host browser setup —
      # mirroring the project's "everything containerized" constraint.
      # The container runs as a non-root user (uid 1000) that cannot write
      # to the runner-owned workspace, so render into a world-writable
      # `dist/` directory instead of the repo root.
      - name: Build PDF
        run: |
          mkdir -p dist
          chmod 777 dist
          docker run --rm -v "$PWD:/home/marp/app" \
            ghcr.io/marp-team/marp-cli:latest \
            terminschleuder-overview.md -o dist/slides.pdf --html --allow-local-files

      - name: Upload slides artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slides
          path: dist/slides.pdf
          if-no-files-found: error

  # Every accepted change on main (a PR merge or a push) cuts the next CalVer
  # release (YYYY.MINOR.0, e.g. v2026.1.0): it downloads the deck PDF built
  # above, then creates the git tag + GitHub Release with the PDF attached.
  # PRs and develop pushes build the deck above but never release.
  release:
    name: Version & cut release (deck PDF)
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create tag + GitHub Release
    concurrency:
      group: release-queue
      cancel-in-progress: false   # serialize releases; never kill one

    steps:
      # Full history: the version computation must see all remote tags
      # (CalVer tags are created here, not locally).
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute next version (CalVer YYYY.MINOR.0)
        id: version
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          LATEST=$(git tag -l "v${YEAR}.*" | sort -V | tail -n1)
          MINOR=0
          [ -n "$LATEST" ] && MINOR=$(echo "$LATEST" | cut -d. -f2)
          NEXT="${YEAR}.$((MINOR + 1)).0"
          # Idempotent re-run: if the tag already exists on THIS commit (a
          # failed release retried), reuse it rather than skipping a version.
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            if [ "$(git rev-parse "v${NEXT}^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::tag v${NEXT} already exists on a different commit" >&2
              exit 1
            fi
            echo "Reusing existing tag v${NEXT} for this commit (failed-run retry)."
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"     >> "$GITHUB_OUTPUT"

      - name: Download deck PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides
          path: dist

      # LAST, deliberately: a failed earlier step re-runs with the same
      # version and re-uploads the same assets, then cuts the release — never
      # the reverse. gh is preinstalled on the runner; creating a release for
      # a nonexistent tag also creates the tag at --target, and the
      # API-attached source tarballs publish the source.
      - name: Create tag & GitHub Release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Automated CalVer release $VERSION of the architecture deck." \
            --generate-notes \
            "dist/slides.pdf#Deck rendered by CI (Marp)"